<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Timer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
        }

        .layout {
            display: flex;
            flex-direction: column;
            height: 100dvh;
        }

        .clock-row {
            flex: 1;
            overflow: hidden;
        }

        .timers-row {
            flex: 4;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }

        .timer-section {
            flex: 1;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <div class="layout">
        <div class="clock-row">
            <iframe src="clock/" frameborder="0"></iframe>
        </div>
        <div class="timers-row">
            <div class="timer-section">
                <iframe
                    src="index.html?date=2026-09-22&backgroundColor=%23D10727&primaryColor=%23F70B38&secondaryColor=%23280F15&logoURL=logos%2Fshanghai-2026-logo.png&showDetails=true"
                    frameborder="0"></iframe>
            </div>
            <div class="timer-section">
                <iframe
                    src="index.html?date=2026-04-13&backgroundColor=%23F4F9F4&primaryColor=%23006E30&secondaryColor=%23C8E6D0&logoURL=logos%2Fesnc-2026-thumbnail.jpg&showDetails=true&lightTheme=true"
                    frameborder="0"></iframe>
            </div>
        </div>
    </div>
</body>

</html>
