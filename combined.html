<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Timer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
        }

        .layout {
            display: flex;
            flex-direction: column;
            height: 100dvh;
        }

        .clock-row {
            flex: 1;
            overflow: hidden;
        }

        .timer-row {
            flex: 2.5;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <div class="layout">
        <div class="clock-row">
            <iframe src="clock/index.html" frameborder="0"></iframe>
        </div>
        <div class="timer-row">
            <iframe
                src="index.html?date=2026-04-13&backgroundColor=%23FFFFFF&primaryColor=%23C8A600&secondaryColor=%23FFF5C2&logoURL=logos%2Fesnc-2026-thumbnail.jpg&showDetails=true&lightTheme=true&logoMaxHeight=420"
                frameborder="0"></iframe>
        </div>
        <div class="timer-row">
            <iframe
                src="index.html?date=2026-09-22&backgroundColor=%23D10727&primaryColor=%23F70B38&secondaryColor=%23280F15&logoURL=logos%2Fshanghai-2026-logo.png&showDetails=true"
                frameborder="0"></iframe>
        </div>
    </div>
</body>

</html>
