<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Timer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
        }

        .rows {
            display: flex;
            flex-direction: column;
            height: 100dvh;
        }

        .section {
            overflow: hidden;
            position: relative;
        }

        .clock-section {
            flex: 1;
        }

        .timer-section {
            flex: 2.5;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <div class="rows">
        <div class="section clock-section">
            <iframe src="clock/" frameborder="0"></iframe>
        </div>
        <div class="section timer-section">
            <iframe
                src="index.html?date=2026-09-22&backgroundColor=%23D10727&primaryColor=%23F70B38&secondaryColor=%23280F15&logoURL=logos%2Fshanghai-2026-logo.png&showDetails=true"
                frameborder="0"></iframe>
        </div>
        <div class="section timer-section">
            <iframe
                src="index.html?date=2026-04-13&backgroundColor=%23003A18&primaryColor=%2300732F&secondaryColor=%23001A0B&logoURL=logos%2Fesnc-2026-thumbnail.jpg&showDetails=true"
                frameborder="0"></iframe>
        </div>
    </div>
</body>

</html>
