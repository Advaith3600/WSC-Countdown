<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competition Timer</title>

  <link rel="stylesheet" href="clock.css" />
</head>

<body>
  <div class="container">
    <div id="timer-container">
      <div class="text-gradient timer-label">Current Time</div>
      <div class="text-gradient" id="timer_date"></div>

      <div class="timer-wrapper">
        <div class="timer">
          <div class="timer_block">
            <div class="timer_block__content" id="timer_block__hours" data-content="0">
              <span>0</span>
            </div>
          </div>

          <div class="timer_separator">
            <div></div>
            <div></div>
          </div>

          <div class="timer_block">
            <div class="timer_block__content" id="timer_block__minutes" data-content="0">
              <span>0</span>
            </div>
          </div>

          <div class="timer_separator">
            <div></div>
            <div></div>
          </div>

          <div class="timer_block">
            <div class="timer_block__content" id="timer_block__seconds" data-content="0">
              <span>0</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../moment.min.js"></script>
  <script src="clock.js"></script>
</body>

</html>
