<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competition Timer</title>

  <link rel="stylesheet" href="app.css" />
</head>

<body>
  <div class="container">
    <div id="setup-form">
      <label for="title">Title</label>
      <input type="text" id="title" placeholder="Enter title" />

      <label for="subtitle">Subtitle</label>
      <input type="text" id="subtitle" placeholder="Enter subtitle" />

      <div>
        <label for="mode">Timer Mode</label>
        <select name="mode" id="mode">
          <option value="countdown">Countdown</option>
          <option value="clock">Clock</option>
        </select>
      </div>

      <div class="split_half">
        <div>
          <label for="hours">Hours</label>
          <input type="number" id="hours" min="0" placeholder="0" />
        </div>

        <div>
          <label for="minutes">Minutes</label>
          <input type="number" id="minutes" min="0" max="59" placeholder="0" />
        </div>
      </div>

      <button id="start-btn">Start</button>
    </div>

    <div id="timer-container" style="display: none;">
      <div>
        <img src="./images/esnc26.svg" alt="ESNC" class="esnc-logo" />
      </div>

      <div class="countdown-text text-gradient" id="countdown-title"></div>
      <div class="countdown-subtext text-gradient" id="countdown-subtitle"></div>

      <div class="timer-wrapper">
        <div class="timer">
          <div class="timer_block">
            <div class="timer_block__content" id="timer_block__hours" data-content="0">
              <span>0</span>
            </div>
            <div class="timer_block__label text-gradient">Hours</div>
          </div>

          <div class="timer_separator">
            <div></div>
            <div></div>
          </div>

          <div class="timer_block">
            <div class="timer_block__content" id="timer_block__minutes" data-content="0">
              <span>0</span>
            </div>
            <div class="timer_block__label text-gradient">Minutes</div>
          </div>

          <div class="timer_separator">
            <div></div>
            <div></div>
          </div>

          <div class="timer_block">
            <div class="timer_block__content" id="timer_block__seconds" data-content="0">
              <span>0</span>
            </div>
            <div class="timer_block__label text-gradient">Seconds</div>
          </div>
        </div>
      </div>

      <div class="action-btns">
        <button id="pause-resume-btn">Pause</button>
        <button id="fullscreen-btn">Fullscreen</button>
        <button id="reset-btn">Reset</button>
      </div>
    </div>
  </div>

  <script src="moment.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
