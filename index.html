<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>

    <link rel="stylesheet" href="app.css" />
    <script src="app.js" defer></script>
</head>

<body>
    <div id="logo-wrapper">
        <!-- <img id="logo" src="" alt="Logo" /> -->
    </div>

    <div class="text-gradient" id="timer_date"></div>

    <!-- Row 1: Total Days | Hours -->
    <div class="timer-wrapper">
        <div class="timer">
            <div class="timer_block">
                <div class="timer_block__content" id="timer_block__days" data-content="00">
                    <span>00</span>
                </div>

                <div class="timer_block__label text-gradient">Total Days</div>
            </div>

            <div class="timer_separator__full">
                <div></div>
            </div>

            <div class="timer_block">
                <div class="timer_block__content" id="timer_block__hours" data-content="00">
                    <span>00</span>
                </div>

                <div class="timer_block__label text-gradient">Hours</div>
            </div>
        </div>
    </div>

    <!-- Row 2: Minutes | Seconds (shown when showDetails=true) -->
    <div class="timer-wrapper" id="timer-detail-wrapper" style="display: none;">
        <div class="timer">
            <div class="timer_block">
                <div class="timer_block__content" id="timer_block__minutes" data-content="00">
                    <span>00</span>
                </div>

                <div class="timer_block__label text-gradient">Minutes</div>
            </div>

            <div class="timer_separator__full">
                <div></div>
            </div>

            <div class="timer_block">
                <div class="timer_block__content" id="timer_block__seconds" data-content="00">
                    <span>00</span>
                </div>

                <div class="timer_block__label text-gradient">Seconds</div>
            </div>
        </div>
    </div>
</body>

</html>
