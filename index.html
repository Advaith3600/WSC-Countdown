<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>

    <link rel="stylesheet" href="app.css" />

    <script src="moment.min.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body>
    <div id="logo-wrapper">
        <!-- <img id="logo" src="" alt="Logo" /> -->
    </div>

    <div class="timer-wrapper">
        <div class="timer">
            <div class="timer_block">
                <div class="timer_block__content" id="timer_block__days" data-content="0">
                    <span>0</span>
                </div>

                <div class="timer_block__label">DAYS</div>
            </div>

            <div class="timer_separator__full">
                <div></div>
            </div>

            <div class="timer_block">
                <div class="timer_block__content" id="timer_block__trainable_hours" data-content="0">
                    <span>0</span>
                </div>

                <div class="timer_block__label">Trainable Hours</div>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
